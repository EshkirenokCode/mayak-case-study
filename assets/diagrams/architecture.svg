18" font-weight="normal" fill="#222">Auth / PostgREST / Storage</text><path d="M654 370 L654 414" stroke="#777" stroke-width="1.5" fill="none"/><rect x="466" y="414" width="377" height="91" fill="white" stroke="#777"/><text x="483" y="448" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#222">PostgreSQL</text><text x="483" y="479" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#222">Data and row-level security</text><text x="32" y="566" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#222">Files live in Storage; privileged server paths have explicit authorization.</text><text x="32" y="602" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#222">Docker on one VPS. Push and MAX for notifications. Encrypted backups offsite.</text></svg>